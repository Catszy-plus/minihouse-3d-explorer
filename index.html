<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniHouse 3D Explorer</title>
  </head>
  <body>
    <header>
      <h1>MiniHouse 3D Explorer</h1>
      <p class="hint">Seret untuk memutar rumah, gulir atau cubit untuk memperbesar dan memperkecil.</p>
    </header>
    <div id="status" role="status"></div>
    <div class="layout">
      <main id="scene" role="img" aria-label="Model rumah 3D yang dapat diputar dan diperbesar"></main>
      <aside class="panel">
        <section aria-labelledby="room-list-title">
          <h2 id="room-list-title">Daftar Ruangan</h2>
          <ul id="room-list" class="room-list"></ul>
        </section>
        <section id="room-info" class="room-info" aria-live="polite"></section>
      </aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
